services:
  postgres:
    image: postgres:16-alpine
    container_name: ticketmatrix-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d ticketmatrix_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticketmatrix-api
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ticketmatrix_db
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      TICKETMATRIX_SCHEDULER_CLEANUP_INTERVAL_MS: 30000
    ports:
      - "8080:8080"




