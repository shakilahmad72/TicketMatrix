spring.application.name=ticketmatrix
# Server Port
server.port=8081

# MySQL Connection Settings
# Make sure you create the database 'ticketmatrix_db' in MySQL before running!
spring.datasource.url=jdbc:mysql://localhost:3307/ticketmatrix_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# SQL Execution Logging (Helpful to see DB locking in action)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE